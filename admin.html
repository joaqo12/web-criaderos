<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel de administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f0e6; color: #1d2a22; }
  .box { max-width: 380px; margin: 12vh auto; background: #fbf9f3; border: 1px solid #dcd5c3; border-radius: 12px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 700; margin-top: 12px; }
  input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border: 1px solid #d3ccb8; border-radius: 8px; font-size: 14px; }
  button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 8px; background: #1f3a2b; color: #f4f0e6; font-weight: 700; cursor: pointer; }
  .err { color: #a33; font-size: 13px; margin-top: 12px; min-height: 16px; }
  .hidden { display: none; }

  .wrap { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .card { background: #fbf9f3; border: 1px solid #dcd5c3; border-radius: 12px; padding: 20px; margin: 16px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  textarea, select { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border: 1px solid #d3ccb8; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .fila { display: flex; align-items: center; gap: 14px; background: #fbf9f3; border: 1px solid #dcd5c3; border-radius: 10px; padding: 10px; margin-top: 10px; }
  .fila img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; background: #ddd; }
  .fila div:nth-child(2) { flex: 1; }
  .acc { display: flex; gap: 8px; }
  .acc button, .sec { margin-top: 0; padding: 7px 12px; background: #fff; color: #1f3a2b; border: 1px solid #1f3a2b; }
  .rojo { color: #a33 !important; border-color: #a33 !important; }
  .attr { display: flex; gap: 8px; margin-top: 8px; }
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .fotos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #e4e9db; margin-top: 6px; }
  @media (max-width: 600px) { .grid2, .fotos { grid-template-columns: 1fr; } }
  
</style>
</head>
<body>

<div id="login" class="box hidden">
  <h1>Panel de administración</h1>
  <form id="f-login">
    <label>Email<input id="email" type="email" required autocomplete="username"/></label>
    <label>Contraseña<input id="pass" type="password" required autocomplete="current-password"/></label>
    <button type="submit">Entrar</button>
    <div id="err" class="err"></div>
  </form>
</div>

<div id="app" class="wrap hidden">
  <div class="top">
    <div><h1 id="app-title"></h1><small id="app-user"></small></div>
    <button id="salir">Cerrar sesión</button>
  </div>
  <h2>Animales</h2>
  <button id="a-nuevo">+ Nuevo animal</button>
  <div id="a-msg" class="err"></div>

  <form id="a-form" class="card hidden">
    <div class="grid2">
      <label>Nombre<input id="a-name" required/></label>
      <label>Categoría<select id="a-cat"></select></label>
      <label>Etiqueta (ej: Toro)<input id="a-tag"/></label>
      <label>Raza<input id="a-breed"/></label>
      <label>RP / Lote<input id="a-rp"/></label>
      <label>Estado<select id="a-status"></select></label>
      <label>Precio (texto, ej: Consultar)<input id="a-price"/></label>
      <label>Etiquetas (separadas por coma)<input id="a-tags"/></label>
    </div>
    <label>Observaciones<textarea id="a-obs" rows="3"></textarea></label>
    <label>Datos de la ficha</label>
    <div id="a-attrs"></div>
    <button type="button" class="sec" id="a-add-attr">+ Agregar dato</button>
    <label>Fotos (principal, 2 y 3)</label>
    <div class="fotos">
      <div><input type="file" accept="image/*" data-foto="0"/><img id="foto-0"/></div>
      <div><input type="file" accept="image/*" data-foto="1"/><img id="foto-1"/></div>
      <div><input type="file" accept="image/*" data-foto="2"/><img id="foto-2"/></div>
    </div>
    <button type="submit">Guardar</button>
    <button type="button" class="sec" id="a-cancel">Cancelar</button>
    <div id="a-form-msg" class="err"></div>
  </form>

  <div id="a-lista"></div>
    <h2 style="margin-top:36px">Lotes</h2>
  <button id="l-nuevo">+ Nuevo lote</button>
  <div id="l-msg" class="err"></div>

  <form id="l-form" class="card hidden">
    <div class="grid2">
      <label>Código (ej: L-01)<input id="l-code" required/></label>
      <label>Categoría<select id="l-cat"></select></label>
      <label>Descripción<input id="l-desc"/></label>
      <label>Raza<input id="l-breed"/></label>
      <label>Cantidad<input id="l-qty" type="number" min="0"/></label>
      <label>Peso promedio (ej: 360 kg)<input id="l-weight"/></label>
      <label>Estado<select id="l-status"></select></label>
    </div>
    <button type="submit">Guardar</button>
    <button type="button" class="sec" id="l-cancel">Cancelar</button>
    <div id="l-form-msg" class="err"></div>
  </form>

  <div id="l-lista"></div>
  <h2 style="margin-top:36px">Textos e imágenes del sitio</h2>
  <p><small>Los textos van en "Valor". Las fotos se suben con el botón y quedan en "Imagen". Los colores (color_...) van en "Valor", por ejemplo #1f3a2b.</small></p>
  <div id="s-msg" class="err"></div>
  <div id="s-lista"></div>
  <div class="card">
    <b>Agregar una llave nueva</b>
    <div class="grid2">
      <label>Llave (ej: hero_title)<input id="s-newkey"/></label>
      <label>Valor<input id="s-newval"/></label>
    </div>
    <button id="s-add">Agregar</button>
  </div>
  
</div>

<script>
const SUPABASE_URL = 'https://wavxivsalphthkmekzla.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ugsbe8guq0pJFWiGiarZZQ__6JVV-Ix';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
let SITE = null;

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }

  const { data: asign } = await sb.from('site_users').select('site_id, sites(name)');
  if (!asign || !asign.length) {
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    $('#err').textContent = 'Este usuario no tiene ninguna cabaña asignada.';
    await sb.auth.signOut();
    return;
  }
  SITE = asign[0].site_id;
  $('#app-title').textContent = asign[0].sites ? asign[0].sites.name : SITE;
  $('#app-user').textContent = 'Sesión iniciada como ' + session.user.email;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');   cargarAnimales(); cargarLotes(); cargarSettings();
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CATS = ['toros', 'vientres', 'vaquillonas', 'terneros'];
const ESTADOS = ['Disponible', 'Reservado', 'Plantel'];
let LISTA = [], EDIT = null, FOTOS = ['', '', ''];

$('#a-cat').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');
$('#a-status').innerHTML = ESTADOS.map(c => `<option>${c}</option>`).join('');

async function subirFoto(file) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${SITE}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from('animales').upload(path, file, { cacheControl: '3600' });
  if (error) throw error;
  return sb.storage.from('animales').getPublicUrl(path).data.publicUrl;
}

function addAttr(k = '', v = '') {
  const d = document.createElement('div'); d.className = 'attr';
  d.innerHTML = `<input placeholder="Dato (ej: Edad)" value="${esc(k)}"/><input placeholder="Valor (ej: 3 años)" value="${esc(v)}"/><button type="button" class="sec rojo">✕</button>`;
  d.querySelector('button').onclick = () => d.remove();
  $('#a-attrs').appendChild(d);
}

function pintarFotos() {
  FOTOS.forEach((u, i) => { const im = $('#foto-' + i); im.src = u || ''; im.style.visibility = u ? 'visible' : 'hidden'; });
}

function abrirForm(a) {
  EDIT = a ? a.id : null;
  $('#a-name').value = a?.name || '';
  $('#a-cat').value = a?.category || CATS[0];
  $('#a-tag').value = a?.tag || '';
  $('#a-breed').value = a?.breed || '';
  $('#a-rp').value = a?.rp || '';
  $('#a-status').value = a?.status || ESTADOS[0];
  $('#a-price').value = a?.price || '';
  $('#a-tags').value = (a?.tags || []).join(', ');
  $('#a-obs').value = a?.observations || '';
  $('#a-attrs').innerHTML = '';
  Object.entries(a?.attributes || {}).forEach(([k, v]) => addAttr(k, v));
  if (!a) addAttr();
  FOTOS = [a?.main_image_url || '', (a?.gallery_urls || [])[0] || '', (a?.gallery_urls || [])[1] || ''];
  document.querySelectorAll('[data-foto]').forEach(i => i.value = '');
  pintarFotos();
  $('#a-form-msg').textContent = '';
  $('#a-form').classList.remove('hidden');
  $('#a-form').scrollIntoView({ behavior: 'smooth' });
}

async function cargarAnimales() {
  const { data, error } = await sb.from('animals').select('*').eq('site_id', SITE).order('id');
  if (error) { $('#a-msg').textContent = error.message; return; }
  LISTA = data;
  $('#a-lista').innerHTML = data.length ? data.map(a => `
    <div class="fila">
      <img src="${esc(a.main_image_url)}" onerror="this.style.visibility='hidden'"/>
      <div><b>${esc(a.name)}</b><br><small>${esc(a.category)} · ${esc(a.status)} · ${esc(a.breed)}</small></div>
      <div class="acc"><button data-ed="${a.id}">Editar</button><button class="rojo" data-del="${a.id}">Borrar</button></div>
    </div>`).join('') : '<p>No hay animales todavía.</p>';
}

$('#a-nuevo').onclick = () => abrirForm(null);
$('#a-cancel').onclick = () => $('#a-form').classList.add('hidden');
$('#a-add-attr').onclick = () => addAttr();

document.querySelectorAll('[data-foto]').forEach(inp => inp.addEventListener('change', async () => {
  const f = inp.files[0]; if (!f) return;
  $('#a-form-msg').textContent = 'Subiendo foto...';
  try { FOTOS[+inp.dataset.foto] = await subirFoto(f); pintarFotos(); $('#a-form-msg').textContent = ''; }
  catch (e) { $('#a-form-msg').textContent = 'Error al subir: ' + e.message; }
}));

$('#a-form').addEventListener('submit', async e => {
  e.preventDefault();
  const attrs = {};
  document.querySelectorAll('#a-attrs .attr').forEach(r => { const [k, v] = r.querySelectorAll('input'); if (k.value.trim()) attrs[k.value.trim()] = v.value.trim(); });
  const row = {
    site_id: SITE,
    name: $('#a-name').value.trim(), category: $('#a-cat').value, tag: $('#a-tag').value.trim(),
    breed: $('#a-breed').value.trim(), rp: $('#a-rp').value.trim(), status: $('#a-status').value,
    price: $('#a-price').value.trim(), observations: $('#a-obs').value.trim(),
    tags: $('#a-tags').value.split(',').map(x => x.trim()).filter(Boolean),
    attributes: attrs, main_image_url: FOTOS[0], gallery_urls: [FOTOS[1], FOTOS[2]]
  };
  const { error } = EDIT ? await sb.from('animals').update(row).eq('id', EDIT) : await sb.from('animals').insert(row);
  if (error) { $('#a-form-msg').textContent = 'Error: ' + error.message; return; }
  $('#a-form').classList.add('hidden');
  cargarAnimales();
});

$('#a-lista').addEventListener('click', async e => {
  const ed = e.target.dataset.ed, del = e.target.dataset.del;
  if (ed) abrirForm(LISTA.find(a => a.id == ed));
  if (del && confirm('¿Borrar este animal? No se puede deshacer.')) {
    const { error } = await sb.from('animals').delete().eq('id', del).eq('site_id', SITE);
    if (error) $('#a-msg').textContent = error.message; else cargarAnimales();
  }
});
  let LOTS = [], LEDIT = null;
$('#l-cat').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');
$('#l-status').innerHTML = ESTADOS.map(c => `<option>${c}</option>`).join('');

function abrirLote(l) {
  LEDIT = l ? l.id : null;
  $('#l-code').value = l?.lot_code || '';
  $('#l-cat').value = l?.category || CATS[0];
  $('#l-desc').value = l?.description || '';
  $('#l-breed').value = l?.breed || '';
  $('#l-qty').value = l?.quantity ?? '';
  $('#l-weight').value = l?.average_weight || '';
  $('#l-status').value = l?.status || ESTADOS[0];
  $('#l-form-msg').textContent = '';
  $('#l-form').classList.remove('hidden');
  $('#l-form').scrollIntoView({ behavior: 'smooth' });
}

async function cargarLotes() {
  const { data, error } = await sb.from('lots').select('*').eq('site_id', SITE).order('lot_code');
  if (error) { $('#l-msg').textContent = error.message; return; }
  LOTS = data;
  $('#l-lista').innerHTML = data.length ? data.map(l => `
    <div class="fila">
      <div style="flex:1"><b>${esc(l.lot_code)}</b> · ${esc(l.description)}<br><small>${esc(l.category)} · ${esc(l.breed)} · ${esc(l.quantity)} animales · ${esc(l.average_weight)} · ${esc(l.status)}</small></div>
      <div class="acc"><button data-led="${l.id}">Editar</button><button class="rojo" data-ldel="${l.id}">Borrar</button></div>
    </div>`).join('') : '<p>No hay lotes todavía.</p>';
}

$('#l-nuevo').onclick = () => abrirLote(null);
$('#l-cancel').onclick = () => $('#l-form').classList.add('hidden');

$('#l-form').addEventListener('submit', async e => {
  e.preventDefault();
  const row = {
    site_id: SITE,
    lot_code: $('#l-code').value.trim(), category: $('#l-cat').value,
    description: $('#l-desc').value.trim(), breed: $('#l-breed').value.trim(),
    quantity: parseInt($('#l-qty').value) || 0,
    average_weight: $('#l-weight').value.trim(), status: $('#l-status').value
  };
  const { error } = LEDIT ? await sb.from('lots').update(row).eq('id', LEDIT) : await sb.from('lots').insert(row);
  if (error) { $('#l-form-msg').textContent = 'Error: ' + error.message; return; }
  $('#l-form').classList.add('hidden');
  cargarLotes();
});

$('#l-lista').addEventListener('click', async e => {
  const ed = e.target.dataset.led, del = e.target.dataset.ldel;
  if (ed) abrirLote(LOTS.find(l => l.id == ed));
  if (del && confirm('¿Borrar este lote? No se puede deshacer.')) {
    const { error } = await sb.from('lots').delete().eq('id', del).eq('site_id', SITE);
    if (error) $('#l-msg').textContent = error.message; else cargarLotes();
  }
});

async function cargarSettings() {
  const { data, error } = await sb.from('site_settings').select('*').eq('site_id', SITE).order('key');
  if (error) { $('#s-msg').textContent = error.message; return; }
  $('#s-lista').innerHTML = data.map(s => `
    <div class="card">
      <b>${esc(s.key)}</b>
      <label>Valor<textarea rows="2" data-f="value">${esc(s.value)}</textarea></label>
      <label>Imagen (enlace o subir foto)<input data-f="image_url" value="${esc(s.image_url)}"/></label>
      <input type="file" accept="image/*" data-up="${s.id}"/>
      <img src="${esc(s.image_url)}" style="max-width:160px;display:${s.image_url ? 'block' : 'none'};margin-top:6px;border-radius:6px"/>
      <div class="acc" style="margin-top:10px"><button data-ssave="${s.id}">Guardar</button><button class="rojo" data-sdel="${s.id}">Borrar</button></div>
    </div>`).join('');
}

$('#s-lista').addEventListener('change', async e => {
  if (!e.target.dataset.up) return;
  const f = e.target.files[0]; if (!f) return;
  const card = e.target.closest('.card');
  $('#s-msg').textContent = 'Subiendo foto...';
  try {
    const url = await subirFoto(f);
    card.querySelector('[data-f=image_url]').value = url;
    const im = card.querySelector('img'); im.src = url; im.style.display = 'block';
    $('#s-msg').textContent = 'Foto subida. Tocá Guardar para aplicarla.';
  } catch (err) { $('#s-msg').textContent = 'Error al subir: ' + err.message; }
});

$('#s-lista').addEventListener('click', async e => {
  const sv = e.target.dataset.ssave, del = e.target.dataset.sdel;
  if (sv) {
    const card = e.target.closest('.card');
    const row = { value: card.querySelector('[data-f=value]').value, image_url: card.querySelector('[data-f=image_url]').value.trim() || null, updated_at: new Date().toISOString() };
    const { error } = await sb.from('site_settings').update(row).eq('id', sv).eq('site_id', SITE);
    $('#s-msg').textContent = error ? 'Error: ' + error.message : 'Guardado.';
  }
  if (del && confirm('¿Borrar esta llave? La web vuelve al texto original del código.')) {
    const { error } = await sb.from('site_settings').delete().eq('id', del).eq('site_id', SITE);
    if (error) $('#s-msg').textContent = error.message; else cargarSettings();
  }
});

$('#s-add').onclick = async () => {
  const key = $('#s-newkey').value.trim();
  if (!key) { $('#s-msg').textContent = 'Poné el nombre de la llave.'; return; }
  const { error } = await sb.from('site_settings').insert({ site_id: SITE, key, value: $('#s-newval').value });
  if (error) { $('#s-msg').textContent = 'Error: ' + error.message; return; }
  $('#s-newkey').value = ''; $('#s-newval').value = '';
  cargarSettings();
};

  
$('#f-login').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
  if (error) { $('#err').textContent = 'Email o contraseña incorrectos.'; return; }
  iniciar();
});
$('#salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

iniciar();
</script>
</body>
</html>
